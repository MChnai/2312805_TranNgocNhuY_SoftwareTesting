name: YummyApp Mobile Backend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mobile-test-job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Static Code Analysis (Linter)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Execute Tests & Quality Gate
        run: |
          coverage run -m unittest discover -s . -p "test_*.py"
          coverage report -m
          coverage html -d coverage_html
          coverage report --fail-under=80

      - name: 6. Upload HTML Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YummyApp-Coverage-Report
          path: coverage_html/
          retention-days: 7
